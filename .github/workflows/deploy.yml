name: Test & Deploy

# Kør automatisk ved push til main, eller manuelt via "Run workflow"-knappen
# i GitHub Actions UI (Actions → Test & Deploy → Run workflow).
on:
  push:
    branches:
      - main
      - claude/partners-game-app-Z6NJW
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy til Firebase Hosting efter test"
        type: boolean
        default: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      # True når deploy-secret findes (sættes af repo-ejer)
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      FIREBASE_PROJECT_ID: partners-8d4aa
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter deps
        run: flutter pub get

      - name: Analyze
        # --no-fatal-infos: info-niveau lints (fx 'withOpacity' deprecation)
        # skal ikke fælde bygningen; warnings og errors gør stadig.
        run: flutter analyze --no-fatal-infos

      - name: Unit & engine tests (5 hele spil + regler)
        run: flutter test --reporter expanded

      - name: Byg web (release)
        run: flutter build web --release --base-href "/"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Playwright end-to-end
        continue-on-error: true
        run: npx playwright test
        env:
          CI: "true"

      - name: Saml testrapport til hosting
        if: always()
        run: |
          mkdir -p build/web/test-report
          if [ -d playwright-report ]; then cp -r playwright-report/* build/web/test-report/ || true; fi

      - name: Upload testartefakter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Skriv resumé
        if: always()
        run: |
          {
            echo "## Partners — Test & Deploy"
            echo ""
            echo "- Flutter analyze + tests: se 'Flutter tests' check ovenfor"
            echo "- Playwright: se artefakt **test-report**"
            if [ "$HAS_SA" = "true" ]; then
              echo "- Deploy: udført til https://partners.vejleaa.dk"
              echo "- Testrapport (live): https://partners.vejleaa.dk/test-report/"
            else
              echo "- Deploy: **sprunget over** — secret FIREBASE_SERVICE_ACCOUNT mangler"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skriv service account til fil
        if: env.HAS_SA == 'true' && (github.event_name == 'push' || inputs.deploy)
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$HOME/firebase-sa.json"

      - name: Deploy til Firebase Hosting
        if: env.HAS_SA == 'true' && (github.event_name == 'push' || inputs.deploy)
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/firebase-sa.json

      - name: Deploy Firestore-regler (kræver at Firestore er aktiveret)
        if: env.HAS_SA == 'true' && (github.event_name == 'push' || inputs.deploy)
        continue-on-error: true
        run: firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/firebase-sa.json
