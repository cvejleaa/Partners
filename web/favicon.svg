<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Partners">
  <!-- Baggrund: app'ens brune tema med afrundede hjørner -->
  <rect width="64" height="64" rx="14" fill="#8B5E3C"/>
  <rect x="3" y="3" width="58" height="58" rx="12" fill="none" stroke="#5E3D24" stroke-width="2"/>

  <!-- Central ring (spillets midte / mål) -->
  <circle cx="32" cy="32" r="8.5" fill="none" stroke="#F5EAD2" stroke-width="3"/>

  <!-- Fire spillebrikker omkring midten — Partners' fire farver -->
  <!-- Top: rød -->
  <circle cx="32" cy="13" r="6.5" fill="#E53935" stroke="#F5EAD2" stroke-width="1.5"/>
  <!-- Højre: blå -->
  <circle cx="51" cy="32" r="6.5" fill="#1E88E5" stroke="#F5EAD2" stroke-width="1.5"/>
  <!-- Bund: grøn -->
  <circle cx="32" cy="51" r="6.5" fill="#43A047" stroke="#F5EAD2" stroke-width="1.5"/>
  <!-- Venstre: gul -->
  <circle cx="13" cy="32" r="6.5" fill="#FDD835" stroke="#F5EAD2" stroke-width="1.5"/>
</svg>
