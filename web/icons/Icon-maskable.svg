<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Partners maskerbart app-ikon">
  <!-- Maskerbart ikon: fuld brun baggrund, motiv holdt inden for den sikre zone (inderste ~80%)
       så det overlever cirkel-/squircle-beskæring paa Android/PWA. -->
  <rect width="512" height="512" fill="#8B5E3C"/>

  <!-- Central ring (mindre, inden for safe zone) -->
  <circle cx="256" cy="256" r="52" fill="none" stroke="#F5EAD2" stroke-width="18"/>

  <!-- Fire spillebrikker, traekket ind mod midten for at undgaa beskaering -->
  <circle cx="256" cy="134" r="42" fill="#E53935" stroke="#F5EAD2" stroke-width="9"/>
  <circle cx="378" cy="256" r="42" fill="#1E88E5" stroke="#F5EAD2" stroke-width="9"/>
  <circle cx="256" cy="378" r="42" fill="#43A047" stroke="#F5EAD2" stroke-width="9"/>
  <circle cx="134" cy="256" r="42" fill="#FDD835" stroke="#F5EAD2" stroke-width="9"/>
</svg>
