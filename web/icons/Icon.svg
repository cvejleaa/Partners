<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Partners app-ikon">
  <!-- App-ikon: Partners. Brun baggrund (#8B5E3C) med fire farvede brikker om en central ring. -->
  <rect width="512" height="512" rx="112" fill="#8B5E3C"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#5E3D24" stroke-width="14"/>

  <!-- Central ring -->
  <circle cx="256" cy="256" r="64" fill="none" stroke="#F5EAD2" stroke-width="22"/>

  <!-- Fire spillebrikker (Partners' farver) -->
  <circle cx="256" cy="104" r="52" fill="#E53935" stroke="#F5EAD2" stroke-width="11"/>
  <circle cx="408" cy="256" r="52" fill="#1E88E5" stroke="#F5EAD2" stroke-width="11"/>
  <circle cx="256" cy="408" r="52" fill="#43A047" stroke="#F5EAD2" stroke-width="11"/>
  <circle cx="104" cy="256" r="52" fill="#FDD835" stroke="#F5EAD2" stroke-width="11"/>
</svg>
